# nginx site for Prime Accessories Kenya (put in /etc/nginx/sites-available/, then enable it).
# Replace example.co.ke and the certificate paths. Run the app on 127.0.0.1:3000 only
# (publish the Docker port as 127.0.0.1:3000:3000) and close port 3000 in the firewall.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name example.co.ke www.example.co.ke;
    return 301 https://example.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.co.ke;

    ssl_certificate     /etc/letsencrypt/live/example.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.co.ke/privkey.pem;

    client_max_body_size 12m;   # admin image uploads
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static build files: the file names change on every build, so cache for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional speed-up: serve uploaded images straight from disk (same folder as UPLOAD_DIR).
    # The app serves them too, so you can leave this out.
    # location /uploads/ {
    #     alias /var/lib/prime/uploads/;
    #     add_header Cache-Control "public, max-age=2592000";
    #     add_header X-Content-Type-Options nosniff;
    #     add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox";
    # }

    # Everything else goes to the app.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANT (rate limits): REPLACE the client's X-Forwarded-For, never append to it.
        # With $proxy_add_x_forwarded_for a visitor can send a fake address and dodge
        # the login and checkout limits. Set TRUST_PROXY_HEADERS=true in the app's .env.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
    }
}
